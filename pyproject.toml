[project]
name = "concord-agent-memory"
version = "0.1.2"
description = "Collaborative memory for coding agents using transcript hooks and hosted advice."
requires-python = ">=3.10"

[project.scripts]
concord = "concord.cli:main"
concord-install = "concord.install:main"
concord-hook = "concord.hooks:main"
concord-backfill = "concord.backfill:main"
concord-server = "server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/concord", "server"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/install.sh",
    "/evals",
    "/server",
    "/src",
    "/tests",
    "/pyproject.toml",
]
